name: CI

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to publish for (chain ops fire against the PR HEAD)'
        required: false
        type: string
      target-env:
        description: 'Deploy the dispatched ref directly against this env. For iteration on the deploy pipeline without merging to main. Leave empty if using pr-number.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - testnet
          - mainnet
          - nexus-testnet-v2-0-rc-1
          - nexus-testnet-v2-0-rc-8
          - nexus-testnet
          - testnet-v2
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'iterate/testnet/**'
      - 'iterate/mainnet/**'
      - 'iterate/nexus-testnet-v2-0-rc-1/**'
      - 'iterate/nexus-testnet-v2-0-rc-8/**'
      - 'iterate/nexus-testnet/**'
      - 'iterate/testnet-v2/**'
    # Tag-driven deploy. The tag prefix selects the env:
    #   testnet-*                    →  full pipeline against testnet
    #   mainnet-*                    →  full pipeline against mainnet
    #   nexus-testnet-v2-0-rc-1-*    →  full pipeline against the v2 RC env
    #   nexus-testnet-v2-0-rc-8-*    →  full pipeline against the rc-8
    #                                   rehearsal env (math-only allowlist)
    #   nexus-testnet-*              →  full pipeline against the long-lived
    #                                   upgradable nexus-testnet env
    #   testnet-v2-*                 →  full pipeline against the testnet-v2 env
    # Prefix subsumption: nexus-testnet-* subsumes the rc prefixes, and
    # testnet-* subsumes testnet-v2-*. So in every env-resolution ternary
    # below, the more specific check (rc-*, testnet-v2-*) MUST stay above the
    # generic one (nexus-testnet, testnet) — new tracks go above accordingly.
    # Tags are immutable per the convention, so each release-style
    # promotion lands on a specific commit and the deploy run is
    # attributable to that exact ref. No merge-strategy gotchas, no
    # ephemeral promote/* branches, no long-lived deploy branches to
    # keep clean.
    tags:
      - 'testnet-*'
      - 'mainnet-*'
      - 'nexus-testnet-v2-0-rc-1-*'
      - 'nexus-testnet-*'
      - 'testnet-v2-*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  checks: write

# Serialize chain-touching runs per target network so two pushes can't race on
# wallet consolidation, register PTBs, or terraform apply locks. Different
# networks (testnet vs mainnet) run in parallel; PRs (dry-run only) are keyed
# per-PR; push-to-main (image builds only, no chain ops) is keyed per-ref.
# `cancel-in-progress: false` queues subsequent runs instead of cancelling —
# we never want to abandon a half-finished register/apply sequence.
concurrency:
  group: >-
    ${{
      (startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-1-') || startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/')) && 'chain-nexus-testnet-v2-0-rc-1' ||
      (startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-8-') || startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/')) && 'chain-nexus-testnet-v2-0-rc-8' ||
      (startsWith(github.ref_name, 'nexus-testnet-') || startsWith(github.ref_name, 'iterate/nexus-testnet/')) && 'chain-nexus-testnet' ||
      (startsWith(github.ref_name, 'mainnet-') || startsWith(github.ref_name, 'iterate/mainnet/')) && 'chain-mainnet' ||
      (startsWith(github.ref_name, 'testnet-v2-') || startsWith(github.ref_name, 'iterate/testnet-v2/')) && 'chain-testnet-v2' ||
      (startsWith(github.ref_name, 'testnet-') || startsWith(github.ref_name, 'iterate/testnet/')) && 'chain-testnet' ||
      (github.event_name == 'workflow_dispatch' && inputs.target-env != '') && format('chain-{0}', inputs.target-env) ||
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      format('ref-{0}', github.ref)
    }}
  cancel-in-progress: false

jobs:
  # ── Resolve target ref for workflow_dispatch with PR# ────────
  resolve-target:
    if: github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      head-sha: ${{ steps.r.outputs.head-sha }}
      base-ref: ${{ steps.r.outputs.base-ref }}
    steps:
      - name: Resolve
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.base.ref')
          HEAD_REF=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.head.ref')
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.head.sha')
          echo "base-ref=$BASE" >> "$GITHUB_OUTPUT"
          echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # ── Discover tools (always) ──────────────────────────────────
  # target-ref lets discover resolve the deploy env and honor its
  # env-scoped ALLOWLISTED_TOOLS variable (rc-8 rehearsal deploys math
  # only). Same ternary as deploy's, minus the resolve-target arm —
  # discover runs before/parallel to it, and PR#-dispatch runs fall back
  # to the default env (no allowlist → full matrix), which matches the
  # pre-allowlist behavior.
  discover:
    uses: ./.github/workflows/offchain-tools.discover.yml
    with:
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      target-ref: >-
        ${{
          inputs.target-env ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-1-') && 'nexus-testnet-v2-0-rc-1') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-8-') && 'nexus-testnet-v2-0-rc-8') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-') && 'nexus-testnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'mainnet-') && 'mainnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-v2-') && 'testnet-v2') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-') && 'testnet') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/') && 'nexus-testnet-v2-0-rc-1') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/') && 'nexus-testnet-v2-0-rc-8') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet/') && 'nexus-testnet') ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet-v2/') && 'testnet-v2') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}

  # target-ref passed to callables. The callables' `environment:` expression
  # treats this string as the env hint: it resolves to 'mainnet' when this
  # evaluates to 'mainnet', else 'testnet'. Precedence:
  #   1. PR# dispatch → PR base branch (testnet/mainnet)
  #   2. dispatch with target-env input → that env literal
  #   3. push to iterate/<env>/...   → that env literal
  #   4. PR event                    → PR base
  #   5. push to a deploy branch     → branch name (main/testnet/mainnet)

  # ── Build / push ─────────────────────────────────────────────
  # PR (any base): dry-run on changed matrix.
  # Push main: push on changed matrix (no chain ops).
  # Push iterate/<env>/** or tag testnet-*/mainnet-*: push on all matrix.
  # workflow_dispatch with PR# or target-env: push on all matrix.
  deploy:
    needs: [discover, resolve-target]
    if: always() && !cancelled() && needs.discover.result == 'success'
    uses: ./.github/workflows/offchain-tools.deploy.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-1-') && 'nexus-testnet-v2-0-rc-1') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-8-') && 'nexus-testnet-v2-0-rc-8') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-') && 'nexus-testnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'mainnet-') && 'mainnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-v2-') && 'testnet-v2') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-') && 'testnet') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/') && 'nexus-testnet-v2-0-rc-1') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/') && 'nexus-testnet-v2-0-rc-8') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet/') && 'nexus-testnet') ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet-v2/') && 'testnet-v2') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
      matrix-json: >-
        ${{
          (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main'))
            && needs.discover.outputs.matrix-changed
          || needs.discover.outputs.matrix-all
        }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  # ── Prepare ──────────────────────────────────────────────────
  # Fires on:
  #   - push to iterate/<env>/** branches
  #   - push of testnet-* / mainnet-* tags
  #   - workflow_dispatch with pr-number OR target-env
  prepare:
    needs: [discover, deploy, resolve-target]
    if: >-
      always() && !cancelled() && needs.deploy.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.pr-number != '' || inputs.target-env != '')) ||
       (github.event_name == 'push' && github.ref_type == 'branch' && (
         startsWith(github.ref_name, 'iterate/testnet/') ||
         startsWith(github.ref_name, 'iterate/mainnet/') ||
         startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/') ||
         startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/') ||
         startsWith(github.ref_name, 'iterate/nexus-testnet/') ||
         startsWith(github.ref_name, 'iterate/testnet-v2/')
       )) ||
       (github.event_name == 'push' && github.ref_type == 'tag' && (
         startsWith(github.ref_name, 'testnet-') ||
         startsWith(github.ref_name, 'mainnet-') ||
         startsWith(github.ref_name, 'nexus-testnet-') ||
         startsWith(github.ref_name, 'testnet-v2-')
       )))
    uses: ./.github/workflows/offchain-tools.prepare.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-1-') && 'nexus-testnet-v2-0-rc-1') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-8-') && 'nexus-testnet-v2-0-rc-8') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-') && 'nexus-testnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'mainnet-') && 'mainnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-v2-') && 'testnet-v2') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-') && 'testnet') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/') && 'nexus-testnet-v2-0-rc-1') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/') && 'nexus-testnet-v2-0-rc-8') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet/') && 'nexus-testnet') ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet-v2/') && 'testnet-v2') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
      matrix-json: ${{ needs.discover.outputs.matrix-all }}
    secrets: inherit

  # ── Register (after prepare) ────────────────────────────────
  register:
    needs: [prepare, resolve-target]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    uses: ./.github/workflows/offchain-tools.register.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-1-') && 'nexus-testnet-v2-0-rc-1') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-v2-0-rc-8-') && 'nexus-testnet-v2-0-rc-8') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'nexus-testnet-') && 'nexus-testnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'mainnet-') && 'mainnet') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-v2-') && 'testnet-v2') ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'testnet-') && 'testnet') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-1/') && 'nexus-testnet-v2-0-rc-1') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet-v2-0-rc-8/') && 'nexus-testnet-v2-0-rc-8') ||
          (startsWith(github.ref_name, 'iterate/nexus-testnet/') && 'nexus-testnet') ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet-v2/') && 'testnet-v2') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
    secrets: inherit

  # ── Readiness (PRs targeting testnet/mainnet only) ──────────
  readiness:
    needs: discover
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'testnet' || github.base_ref == 'mainnet') &&
      fromJson(needs.discover.outputs.matrix-changed).include[0] != null
    uses: ./.github/workflows/offchain-tools.readiness.yml
    with:
      matrix-json: ${{ needs.discover.outputs.matrix-changed }}
    secrets: inherit

  # ── Trigger tf-nexus-tools apply (reconcile Cloud Run from GCS state) ──
  # After register has written the new tool's config blob + on-chain entry,
  # kick the terraform stack so Cloud Run services / ALB / DNS records get
  # materialized. We wait for the dispatched run to complete and inherit
  # its conclusion, so register-then-apply is one atomic gate. Uses
  # GH_ACCESS_TOKEN PAT because GITHUB_TOKEN can't dispatch in other repos.
  trigger-tf-apply:
    needs: [register]
    if: always() && !cancelled() && needs.register.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
    steps:
      - name: Require GH_ACCESS_TOKEN
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_ACCESS_TOKEN secret is not configured on this repo (or not scoped to it)."
            exit 1
          fi

      # Polls actions:read endpoints only — works with fine-grained PATs.
      # `gh run watch` would also fetch check annotations (checks:read),
      # which fine-grained PATs cannot carry. ava-game uses the same
      # action for the same reason.
      #
      # rc-8 rehearsal: dispatch DISABLED on this branch. The terraform
      # apply is run manually after the register output has been
      # verified. Re-enable by uncommenting before promoting this wiring
      # to a long-lived track.
      # - name: Dispatch tf-nexus-tools terraform apply and wait
      #   uses: the-actions-org/workflow-dispatch@v4.0.0
      #   with:
      #     repo: Talus-Network/tf-nexus-tools
      #     ref: production
      #     workflow: Terraform
      #     token: ${{ secrets.GH_ACCESS_TOKEN }}
      #     inputs: '{}'
      - name: Terraform apply skipped (manual for rc-8 rehearsal)
        run: echo "tf-nexus-tools apply NOT dispatched — run it manually after verifying register output."

  # ── ci-gate: single required status check for branch protection ──
  ci-gate:
    if: always()
    needs: [discover, deploy, prepare, register, readiness, trigger-tf-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          set -euo pipefail
          declare -A r=(
            [discover]="${{ needs.discover.result }}"
            [deploy]="${{ needs.deploy.result }}"
            [prepare]="${{ needs.prepare.result }}"
            [register]="${{ needs.register.result }}"
            [readiness]="${{ needs.readiness.result }}"
            [trigger-tf-apply]="${{ needs.trigger-tf-apply.result }}"
          )
          for j in "${!r[@]}"; do
            v="${r[$j]}"
            case "$v" in
              success|skipped) echo "✓ $j: $v" ;;
              *) echo "✗ $j: $v"; FAIL=1 ;;
            esac
          done
          [ -z "${FAIL:-}" ] || exit 1
