name: CI

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to publish for (chain ops fire against the PR HEAD)'
        required: false
        type: string
      target-env:
        description: 'Deploy the dispatched ref directly against this env. For iteration on the deploy pipeline without merging to main. Leave empty if using pr-number.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - testnet
          - mainnet
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - testnet
      - mainnet
      - 'iterate/testnet/**'
      - 'iterate/mainnet/**'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  # ── Resolve target ref for workflow_dispatch with PR# ────────
  resolve-target:
    if: github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      head-sha: ${{ steps.r.outputs.head-sha }}
      base-ref: ${{ steps.r.outputs.base-ref }}
    steps:
      - name: Resolve
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.base.ref')
          HEAD_REF=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.head.ref')
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr-number }}" --jq '.head.sha')
          echo "base-ref=$BASE" >> "$GITHUB_OUTPUT"
          echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # ── Discover tools (always) ──────────────────────────────────
  discover:
    uses: ./.github/workflows/offchain-tools.discover.yml
    with:
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  # target-ref passed to callables. The callables' `environment:` expression
  # treats this string as the env hint: it resolves to 'mainnet' when this
  # evaluates to 'mainnet', else 'testnet'. Precedence:
  #   1. PR# dispatch → PR base branch (testnet/mainnet)
  #   2. dispatch with target-env input → that env literal
  #   3. push to iterate/<env>/...   → that env literal
  #   4. PR event                    → PR base
  #   5. push to a deploy branch     → branch name (main/testnet/mainnet)

  # ── Build / push ─────────────────────────────────────────────
  # PR (any base): dry-run on changed matrix.
  # Push main: push on changed matrix (no chain ops).
  # Push testnet/mainnet/iterate/<env>/**: push on all matrix.
  # workflow_dispatch with PR# or target-env: push on all matrix.
  deploy:
    needs: [discover, resolve-target]
    if: always() && !cancelled() && needs.discover.result == 'success'
    uses: ./.github/workflows/offchain-tools.deploy.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
      matrix-json: >-
        ${{
          (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main'))
            && needs.discover.outputs.matrix-changed
          || needs.discover.outputs.matrix-all
        }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  # ── Prepare ──────────────────────────────────────────────────
  # Fires on:
  #   - push to testnet/mainnet/iterate/<env>/**
  #   - workflow_dispatch with pr-number OR target-env
  prepare:
    needs: [discover, deploy, resolve-target]
    if: >-
      always() && !cancelled() && needs.deploy.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.pr-number != '' || inputs.target-env != '')) ||
       (github.event_name == 'push' && (
         github.ref_name == 'testnet' ||
         github.ref_name == 'mainnet' ||
         startsWith(github.ref_name, 'iterate/testnet/') ||
         startsWith(github.ref_name, 'iterate/mainnet/')
       )))
    uses: ./.github/workflows/offchain-tools.prepare.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
      matrix-json: ${{ needs.discover.outputs.matrix-all }}
    secrets: inherit

  # ── Register (after prepare) ────────────────────────────────
  register:
    needs: [prepare, resolve-target]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    uses: ./.github/workflows/offchain-tools.register.yml
    with:
      target-ref: >-
        ${{
          needs.resolve-target.outputs.base-ref ||
          inputs.target-env ||
          (startsWith(github.ref_name, 'iterate/mainnet/') && 'mainnet') ||
          (startsWith(github.ref_name, 'iterate/testnet/') && 'testnet') ||
          (github.event_name == 'pull_request' && github.base_ref) ||
          github.ref_name
        }}
    secrets: inherit

  # ── Readiness (PRs targeting testnet/mainnet only) ──────────
  readiness:
    needs: discover
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'testnet' || github.base_ref == 'mainnet') &&
      fromJson(needs.discover.outputs.matrix-changed).include[0] != null
    uses: ./.github/workflows/offchain-tools.readiness.yml
    with:
      matrix-json: ${{ needs.discover.outputs.matrix-changed }}
    secrets: inherit

  # ── Retrigger PR after dispatched run (flips readiness green) ──
  retrigger-pr:
    needs: [register, resolve-target]
    if: always() && !cancelled() && needs.register.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/retrigger-pr
        with:
          pr-number: ${{ inputs.pr-number }}
          gpg-signing-key: ${{ secrets.GPG_DEVOPS_SIGNING_KEY }}
          github-token: ${{ github.token }}

  # ── ci-gate: single required status check for branch protection ──
  ci-gate:
    if: always()
    needs: [discover, deploy, prepare, register, readiness]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          set -euo pipefail
          declare -A r=(
            [discover]="${{ needs.discover.result }}"
            [deploy]="${{ needs.deploy.result }}"
            [prepare]="${{ needs.prepare.result }}"
            [register]="${{ needs.register.result }}"
            [readiness]="${{ needs.readiness.result }}"
          )
          for j in "${!r[@]}"; do
            v="${r[$j]}"
            case "$v" in
              success|skipped) echo "✓ $j: $v" ;;
              *) echo "✗ $j: $v"; FAIL=1 ;;
            esac
          done
          [ -z "${FAIL:-}" ] || exit 1
