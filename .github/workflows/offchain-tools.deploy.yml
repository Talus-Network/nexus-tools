name: Offchain Tools Deploy

on:
  workflow_call:
    inputs:
      target-ref:
        required: false
        type: string
      matrix-json:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: "Build ${{ matrix.tool }} v${{ matrix.version }}"
    runs-on: ubuntu-latest
    environment: >-
      ${{
        (inputs.target-ref || github.event_name == 'pull_request' && github.base_ref || github.ref_name) == 'mainnet' && 'mainnet' ||
        'testnet'
      }}
    strategy:
      matrix: ${{ fromJson(inputs.matrix-json) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          SHA=${{ steps.sha.outputs.short }}
          GHCR="ghcr.io/${{ github.repository }}/${{ matrix.tool }}:sha-${SHA}"
          {
            echo "list<<EOF"
            echo "${GHCR,,}"
            if [ "${{ inputs.dry-run }}" = "false" ]; then
              echo "gcr.io/${{ vars.GCP_INFRA_PROJECT_ID }}/nexus-tools/${{ matrix.tool }}:sha-${SHA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build first, no auth required. The Rust compile is the slow part —
      # doing auth before this risks the GCP access token (1h lifetime)
      # expiring before the push window. Same pattern as ava-game's
      # protocol.deploy.yml.
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./offchain/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BINARY=${{ matrix.command }}
            TOOL_DIR=${{ matrix.dir }}
            TOOL_FQN_VERSION=${{ matrix.version }}
          cache-from: type=gha,scope=offchain-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=offchain-${{ matrix.tool }}

      - name: Login to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP (infra)
        if: ${{ !inputs.dry-run }}
        id: auth-infra
        uses: ./.github/actions/gcp-auth-infra
        with:
          project-id: ${{ vars.GCP_INFRA_PROJECT_ID }}
          project-number: ${{ vars.GCP_INFRA_PROJECT_NUMBER }}
          provider-name: nexus-tools

      # Push pulls the layers we just built from the gha cache and emits
      # them under the resolved tags. Token freshly minted in the step
      # above, so this completes well within the 1h lifetime.
      - name: Push
        if: ${{ !inputs.dry-run }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./offchain/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BINARY=${{ matrix.command }}
            TOOL_DIR=${{ matrix.dir }}
            TOOL_FQN_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=offchain-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=offchain-${{ matrix.tool }}
