name: Sync Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    uses: ./.github/workflows/detect_changes.yml
    with:
      files: |
        docs/**
        offchain/tools/*/README.md
        authority-pattern/offchain/README.md

  sync-docs:
    runs-on: ubuntu-latest
    name: Sync docs to gitbook-docs repo
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Get repository name
        id: repo-name
        run: echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV

      - name: Checkout gitbook-docs repository
        uses: actions/checkout@v4
        with:
          repository: Talus-Network/gitbook-docs
          path: gitbook-docs

      - name: Sync documentation
        run: |
          mkdir -p gitbook-docs/${{ env.REPO_NAME }}

          # Sync docs folder if changes exist
          if [ -d docs ] && [ "$(ls -A docs)" ]; then
            cp -r docs/* gitbook-docs/${{ env.REPO_NAME }}/
          fi

          # Sync README.md files from discovered offchain Tools and Agent API bundle.
          for readme in offchain/tools/*/README.md authority-pattern/offchain/README.md; do
            manifest="$(dirname "$readme")/tools.json"
            manifest_tool_name=$(jq -er '.tool_name | select(type == "string" and length > 0)' "$manifest")
            case "$readme" in
              authority-pattern/offchain/README.md) docs_tool_name="agent-api" ;;
              *) docs_tool_name="$(basename "$(dirname "$readme")")" ;;
            esac
            publish_docs=$(jq -r '
              if has("publish_docs") then
                if (.publish_docs | type) == "boolean" then .publish_docs
                else error("publish_docs must be a boolean") end
              elif has("deploy") then
                if (.deploy | type) == "boolean" then .deploy
                else error("deploy must be a boolean") end
              else true end
            ' "$manifest")
            if [ "$publish_docs" != "true" ]; then
              echo "Skipping internal tool documentation: $manifest_tool_name"
              continue
            fi
            mkdir -p "gitbook-docs/tools/$docs_tool_name"
            cp "$readme" "gitbook-docs/tools/$docs_tool_name/"
          done

          # Check if any changes were made
          if git -C gitbook-docs status --porcelain | grep .; then
            echo "Changes detected, proceeding with PR."
          else
            echo "No documentation changes found. Skipping."
            exit 0
          fi

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.DEVOPS_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEVOPS_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_PAT }}
          path: gitbook-docs
          commit-message: "Update docs from ${{ env.REPO_NAME }} (commit: ${{ github.sha }})"
          committer: "devops@taluslabs.xyz <devops@taluslabs.xyz>"
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: docs-update-${{ env.REPO_NAME }}-${{ github.sha }}
          delete-branch: true
          title: "Docs update from ${{ env.REPO_NAME }}"
          body: "This PR syncs updates to documentation from the [${{ env.REPO_NAME }}](https://github.com/Talus-Network/${{ env.REPO_NAME }}) repository (source commit: ${{ github.sha }})"
          base: staging
          labels: |
            documentation
            automated pr
            ${{ env.REPO_NAME }}
          team-reviewers: |
            engineering
