# codecov.yml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # Coverage can drop by 1% and still be green
        threshold: 1%
        target: auto # Compares to base branch
        base: auto
        if_ci_failed: error
        informational: false
        only_pulls: false

    patch:
      default:
        # New code should have at least 80% coverage
        target: 80%
        threshold: 10% # Allow 10% drop for edge cases
        base: auto
        if_ci_failed: error
        # Report but don't block. Project-level check still gates the
        # PR on absolute coverage drift; this one was noisy on patches
        # that only touch trivial code (e.g. the fqn!() concat rewrite
        # where every tool's fn fqn() body changed but is still a
        # one-line constant return).
        informational: true

component_management:
  individual_components:
    - component_id: tools
      name: Tools
      paths:
        - offchain/tools/**

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/mock_*.rs"
  - "**/examples/**"
  - "**/benches/**"
  - "**/*.pb.rs"
  - "**/target/**"
  - "**/build.rs"

flags:
  unittests:
    paths:
      - offchain/tools/
    carryforward: true

github_checks:
  annotations: true
