[workspace]
resolver = "3"
members = ["tools/*"]

[workspace.package]
edition = "2021" # "2024" does not compile.
version = "2.0.0-rc.4"
repository = "https://github.com/Talus-Network/nexus-sdk"
homepage = "https://talus.network"
license = "Apache-2.0"
readme = "README.md"
authors = ["Talus Engineering <engineering@taluslabs.xyz>"]
keywords = ["nexus", "talus", "tools", "walrus"]
categories = []

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bytes = "1.11.1"
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
env_logger = "0.11.10"
hex = "0.4.3"
sha2 = "0.11.0"
chrono = { version = "0.4.44", features = ["serde"] }
jsonschema = "0.46.5"
log = "0.4.29"
minijinja = "2.20.0"
mockito = "1.7.2"
portpicker = "0.1.1"
reqwest = { version = "0.12.25", features = ["json", "stream", "gzip", "brotli"] }
rstest = "0.26.1"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serial_test = "3.4.0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
warp = "0.4.3"
zeroize = { version = "1", features = ["zeroize_derive"] }

# === Nexus deps ===
[workspace.dependencies.nexus-sdk]
features = ["full"]
# For local dev convenience
# path = "../../nexus-sdk/sdk"
git = "https://github.com/Talus-Network/nexus-sdk"
rev = "6409e9d29f700169dd00239ceb2f250fb43d3f68"

[workspace.dependencies.nexus-toolkit]
# For local dev convenience
# path = "../../nexus-sdk/toolkit-rust"
git = "https://github.com/Talus-Network/nexus-sdk"
rev = "6409e9d29f700169dd00239ceb2f250fb43d3f68"


[profile.release]
# debug = 1 means line charts only, which is minimum needed for good stack traces
debug = 1
# Write debug info into a separate file.
split-debuginfo = "packed"
# Decrease final binary size
strip = "debuginfo"
# Exit process with SIGABRT when any thread panics
panic = "abort"
