[package]
name = "agent-api"
description = "Authenticated Nexus Agent API and provider lifecycle Tools."
edition = "2021"
version = "2.0.0"
repository = "https://github.com/Talus-Network/nexus-tools"
homepage = "https://talus.network"
license = "Apache-2.0"
readme = "README.md"
authors = ["Talus Engineering <engineering@taluslabs.xyz>"]
keywords = ["nexus", "talus", "tools", "walrus"]
categories = []

[[bin]]
name = "agent-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bcs = "0.1.6"
bytes = "1.11.1"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
nexus-sdk = { git = "https://github.com/Talus-Network/nexus-sdk", rev = "b0bc7611e6785147bcdb3f4ad09f1459df7c80d8", features = ["nexus"] }
nexus-toolkit = { git = "https://github.com/Talus-Network/nexus-sdk", rev = "b0bc7611e6785147bcdb3f4ad09f1459df7c80d8" }
rand = "0.8"
reqwest = { version = "0.12.25", features = ["json", "stream", "gzip", "brotli"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
warp = "0.4.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[build-dependencies]
serde_json = "1.0.149"
toml = "0.8"

[dev-dependencies]
ed25519-dalek = "2.2.0"
mockito = "1.7.2"
nexus-sdk = { git = "https://github.com/Talus-Network/nexus-sdk", rev = "b0bc7611e6785147bcdb3f4ad09f1459df7c80d8", features = ["nexus", "onchain_schema_gen"] }

[workspace]
resolver = "3"

[profile.release]
debug = 1
split-debuginfo = "packed"
strip = "debuginfo"
panic = "unwind"
